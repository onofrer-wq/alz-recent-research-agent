[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alz_research_agent"
version = "1.0.0"
description = "Multi-agent Alzheimer's disease recent research scientific literacy assistant built with Google ADK."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ono Rodriguez" }]
urls = { Repository = "https://github.com/onofrer-wq/alz-recent-research-agent" }
requires-python = ">=3.11"
dependencies = [
    "google-adk[gcp,db,eval,otel-gcp]>=2.13.0,<3.0.0",
    "google-cloud-dlp>=3.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "google-genai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["alz_research_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20", "D1", "ASYNC"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20", "D1", "E501"]
"tests/**" = ["T20", "D1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "eval: marks tests that run agent evaluation suites (require model or scripted runner)",
    "live: marks tests that call live external APIs or cloud services",
]
