name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Quality, Unit Tests & Schema Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint and format check with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Smoke import ADK App and verify plugin stack
        run: |
          uv run python -c "from alz_research_agent.agent import app; assert len(app.plugins) >= 7, f'Expected >=7 plugins, got {len(app.plugins)}'"

      - name: Run offline unit tests
        run: uv run pytest tests/unit -v

      - name: Check exported JSON Schemas for drift
        run: |
          uv run python -m alz_research_agent.schemas --export schemas
          git diff --exit-code schemas/

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform fmt check, init (no backend), and validate
        run: |
          terraform -chdir=deployment/terraform fmt -check
          terraform -chdir=deployment/terraform init -backend=false
          terraform -chdir=deployment/terraform validate

  eval:
    name: Golden Evaluation Suite (Main Only)
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.ref == 'refs/heads/main' && vars.WIF_PROVIDER != '' && vars.DEPLOY_SA != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ADK Golden EvalSet
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'us-central1' }}
        run: |
          uv run adk eval alz_research_agent eval/golden/alz_recent_research.evalset.json \
            --config_file_path=eval/test_config.json \
            --print_detailed_results
